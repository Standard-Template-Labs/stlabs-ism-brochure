<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=700">
<title>Axiom · The Live Graph powering stlabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1A1A1F;
    --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10);
    --text: rgba(254,254,254,0.92);
    --text-2: rgba(254,254,254,0.62);
    --text-3: rgba(254,254,254,0.40);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.18);
    --logo-filter: brightness(0) invert(1);
    --axiom-card-bg: linear-gradient(160deg, rgba(220,90,28,0.12), rgba(220,90,28,0.04));
    --axiom-card-border: rgba(220,90,28,0.18);
    --axiom-brand: #FEFEFE;
  }
  body.light {
    --bg: #FEFEFE;
    --surface: rgba(26,26,31,0.035);
    --border: rgba(26,26,31,0.10);
    --text: #2C2F36;
    --text-2: rgba(44,47,54,0.7);
    --text-3: rgba(44,47,54,0.45);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.10);
    --logo-filter: brightness(0) invert(0);
    --axiom-card-bg: linear-gradient(160deg, rgba(220,90,28,0.10), rgba(220,90,28,0.03));
    --axiom-card-border: rgba(220,90,28,0.30);
    --axiom-brand: #2C2F36;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 700px;
    height: 420px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .stage {
    width: 700px;
    height: 420px;
    position: absolute;
    top: 0; left: 0;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }


  /* ── Nebula glow + stars behind cluster ── */
  .nebula {
    position: absolute;
    left: 10px; top: -40px;
    width: 680px; height: 230px;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 40% 60% at 50% 50%, rgba(220, 90, 28, 0.10), transparent 72%);
    filter: blur(18px);
  }

  /* ── CLUSTER (top) ── */
  .sources {
    position: absolute;
    left: 60px;
    top: 18px;
    width: 580px;
    height: 110px;
    z-index: 3;
  }
  .chip {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .chip__mark { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .chip__mark img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    display: block;
    object-fit: contain;
    opacity: 0.92;
    filter: var(--logo-filter);
    transform: none;
    rotate: 0deg;
  }

  /* ── CONNECTORS ── */
  .connectors {
    position: absolute;
    inset: 0;
    width: 700px;
    height: 700px;
    z-index: 2;
    pointer-events: none;
  }

  /* ── AXIOM CARD (center) ── */
  .axiom-hub {
    position: absolute;
    left: 270px;
    top: 150px;
    width: 160px;
    z-index: 4;
  }
  .axiom-card {
    position: relative;
    width: 100%;
    padding: 8px 14px 12px;
    background: linear-gradient(160deg, rgba(220,90,28,0.12), rgba(220,90,28,0.04));
    border: 1px solid rgba(220,90,28,0.18);
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }
  .axiom-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #FFB48A;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .axiom-kicker .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #FF7A3D;
  }
  .axiom-brand {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #FEFEFE;
  }
  .axiom-sub {
    margin-top: 10px;
    font-size: 10px;
    color: rgba(255,180,140,0.9);
    font-weight: 400;
    white-space: nowrap;
  }

  /* ── OUTCOMES (horizontal row at bottom) ── */
  .outcomes {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 50px;
    display: flex;
    gap: 12px;
    z-index: 4;
  }
  .outcome {
    flex: 1;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .outcome::before { display: none; }
  .outcome .ico { display: none; }
  .outcome h3 {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
    line-height: 1.15;
  }
  .outcome p {
    margin: 6px 0 0 0;
    font-size: 10px;
    color: var(--text-3);
    line-height: 1.3;
  }
</style>
</head>

      <div class="chip" style="left:150px;top:62px;width:14px;height:14px;" data-name="PagerDuty"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/pagerduty.svg" alt="PagerDuty" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:170px;top:48px;width:38px;height:38px;" data-name="Zoom"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/zoom.svg" alt="Zoom" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:400px;top:8px;width:36px;height:36px;" data-name="Splunk"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/splunk.svg" alt="Splunk" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:325px;top:56px;width:22px;height:22px;" data-name="CrowdStrike"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/crowdstrike.svg" alt="CrowdStrike" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:240px;top:48px;width:36px;height:36px;" data-name="Workday"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/workday.svg" alt="Workday" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:270px;top:60px;width:18px;height:18px;" data-name="Intune"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/windows.svg" alt="Intune" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:395px;top:62px;width:16px;height:16px;" data-name="Jamf"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/jamf.svg" alt="Jamf" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:260px;top:18px;width:26px;height:26px;" data-name="Box"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/box.svg" alt="Box" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:355px;top:22px;width:28px;height:28px;" data-name="SAP"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/sap.svg" alt="SAP" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

    <!-- CONNECTORS -->

          <stop offset="100%" stop-color="rgba(220,90,28,0.8)"/>
        </linearGradient>
        <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(220,90,28,0.8)"/>
          <stop offset="100%" stop-color="rgba(244,245,246,0.18)"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- AXIOM CARD -->

      <div class="axiom-card">
        <div class="axiom-kicker"><span class="dot"></span>Live Graph</div>
        <div class="axiom-brand">Axiom</div>
        <div class="axiom-sub">Streaming · Enriched · Joined</div>
      </div>

    <!-- OUTCOMES (horizontal row at bottom) -->
    <div class="outcomes">
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5h7L11 22l8.5-11.5h-7L13 2z"/></svg>
        </div>
        <div>
          <h3>Automation</h3>
          <p>Resolve at machine speed</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.4"/><circle cx="15" cy="14" r="1.4"/><path d="M12 4v4M9 4h6"/></svg>
        </div>
        <div>
          <h3>AI Agents</h3>
          <p>Reason over live context</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
        </div>

        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4V8z"/><path d="M10 6v12" stroke-dasharray="2 2"/></svg>
        </div>

          <h3>Tickets</h3>

        </div>

  </div>

  <script>
    window.addEventListener('load', function () {
      const svg = document.getElementById('connectors');
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const stage = document.getElementById('stage');
      const stageRect = stage.getBoundingClientRect();
      const stageLeft = stageRect.left;
      const stageTop  = stageRect.top;
      const scale = 1;
      const toStage = (cx, cy) => ({
        x: (cx - stageLeft) / scale,
        y: (cy - stageTop)  / scale
      });

      const axiomTop    = { x: 350, y: 150 };


      const axiomBot    = { x: 350, y: 220 };

      const chips = Array.from(document.querySelectorAll('.sources .chip'));

      // Constellation lines: each logo to its single nearest neighbor, stopping before the logo edge
      const cls = Array.from(chips).filter(ch => ch.style.display !== 'none');
      const nodes = cls.map((chip) => {
        const r = chip.getBoundingClientRect();
        const ctr = toStage(r.left + r.width / 2, r.top + r.height / 2);
        return { x: ctr.x, y: ctr.y, r: (r.width / scale) / 2 + 4 };
      });
      const drawn = new Set();
      for (let i = 0; i < nodes.length; i++) {
        let min = Infinity, mj = -1;
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
          if (d < min) { min = d; mj = j; }
        }
        if (mj < 0) continue;
        const key = i < mj ? i + '-' + mj : mj + '-' + i;
        if (drawn.has(key)) continue;
        drawn.add(key);
        const dx = nodes[mj].x - nodes[i].x;
        const dy = nodes[mj].y - nodes[i].y;
        const len = Math.hypot(dx, dy);
        if (len <= nodes[i].r + nodes[mj].r) continue;
        const ux = dx / len, uy = dy / len;
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', nodes[i].x + ux * nodes[i].r);
        line.setAttribute('y1', nodes[i].y + uy * nodes[i].r);
        line.setAttribute('x2', nodes[mj].x - ux * nodes[mj].r);
        line.setAttribute('y2', nodes[mj].y - uy * nodes[mj].r);
        line.setAttribute('stroke', 'rgba(220,90,28,0.25)');
        line.setAttribute('stroke-width', '0.5');
        svg.appendChild(line);
      }

      // Each logo → axiom top
      chips.forEach((chip) => {
        if (chip.style.display === 'none') return;
        const r = chip.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top + r.height);
        const sx = c.x, sy = c.y;
        const ex = axiomTop.x, ey = axiomTop.y;
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#downGrad)');
        path.setAttribute('stroke-width', '0.5');
        path.setAttribute('opacity', '0.40');
        svg.appendChild(path);
      });
      // Axiom bottom → top of each outcome
      document.querySelectorAll('.outcomes .outcome').forEach((el) => {
        const r = el.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top);
        const sx = axiomBot.x, sy = axiomBot.y;
        const ex = c.x, ey = c.y;  // stop just above the outcome's top edge
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#outGrad)');
        path.setAttribute('stroke-width', '0.7');
        path.setAttribute('opacity', '0.5');
        svg.appendChild(path);
      });
    });
  </script>
</body>
</html>
