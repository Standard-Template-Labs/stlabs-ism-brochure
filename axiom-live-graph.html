<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=700">
<title>Axiom · The Live Graph powering stlabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1A1A1F;
    --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10);
    --text: rgba(254,254,254,0.92);
    --text-2: rgba(254,254,254,0.62);
    --text-3: rgba(254,254,254,0.40);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.18);
    --logo-filter: brightness(0) invert(1);
    --axiom-card-bg: #1A1A1F;
    --axiom-card-border: rgba(220,90,28,0.35);
    --axiom-brand: #FEFEFE;
    --tile-bg: #26262C;
    --tile-border: rgba(255,255,255,0.10);
  }
  body.light {
    --bg: #FEFEFE;
    --surface: rgba(26,26,31,0.035);
    --border: rgba(26,26,31,0.10);
    --text: #2C2F36;
    --text-2: rgba(44,47,54,0.7);
    --text-3: rgba(44,47,54,0.45);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.10);
    --logo-filter: brightness(0) invert(0);
    --axiom-card-bg: #DC5A1C;
    --axiom-card-border: #DC5A1C;
    --axiom-brand: #FEFEFE;
    --tile-bg: #F2F3F5;
    --tile-border: rgba(26,26,31,0.12);
  }
  body.light .axiom-kicker { color: rgba(255,255,255,0.92); }
  body.light .axiom-kicker .dot { background: #FEFEFE; }
  body.light .axiom-brand { color: #FEFEFE; }
  body.light .axiom-sub { color: rgba(255,255,255,0.85); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 700px;
    height: 240px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .stage {
    width: 700px;
    height: 240px;
    position: absolute;
    top: 0; left: 0;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }


  /* nebula removed — glow is now inside the Axiom card */

  /* ── CLUSTER (left) ── */
  .sources {
    position: absolute;
    left: 16px;
    top: 16px;
    width: 230px;
    height: 208px;
    z-index: 3;
  }
  .chip {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .chip::before {
    content: '';
    position: absolute;
    inset: -7px;
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 8px;
    z-index: -1;
  }
  .chip--more {
    position: absolute;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .chip--more-center {
    left: 256px;
    top: 113px;
    z-index: 3;
  }
  .chip--more .inf {
    font-size: 20px;
    line-height: 1;
    font-weight: 500;
    margin: 0 6px 0 2px;
  }
  .chip__mark { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .chip__mark img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    display: block;
    object-fit: contain;
    opacity: 0.92;
    filter: var(--logo-filter);
    transform: none;
    rotate: 0deg;
  }

  /* ── CONNECTORS ── */
  .connectors {
    position: absolute;
    inset: 0;
    width: 700px;
    height: 700px;
    z-index: 2;
    pointer-events: none;
  }

  /* ── AXIOM CARD (center) ── */
  .axiom-hub {
    position: absolute;
    left: 320px;
    top: 82px;
    width: 170px;
    z-index: 4;
  }
  .axiom-card {
    position: relative;
    width: 100%;
    padding: 6px 16px 8px;
    background: var(--axiom-card-bg);
    border: 1px solid var(--axiom-card-border);
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
  }
  .axiom-card > * { position: relative; z-index: 1; }
  .axiom-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .axiom-kicker .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  .axiom-brand {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--accent);
  }
  .axiom-sub {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-2);
    font-weight: 400;
    white-space: nowrap;
  }

  /* ── OUTCOMES (vertical stack on right) ── */
  .outcomes {
    position: absolute;
    right: 16px;
    top: 16px;
    bottom: 16px;
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 4;
  }
  .outcome {
    flex: 1;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .outcome::before { display: none; }
  .outcome .ico { display: none; }
  .outcome h3 {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
    line-height: 1.15;
  }
  .outcome p {
    margin: 2px 0 0 0;
    font-size: 9.5px;
    color: var(--text-3);
    line-height: 1.3;
  }
</style>
</head>
<body>

    <!-- LOGOS (cluster, top) -->

      <div class="chip" style="left:9px;top:21px;width:28px;height:28px;" data-name="Microsoft Entra"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/microsoftazure.svg" alt="Microsoft Entra" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:147px;top:21px;width:28px;height:28px;" data-name="GitHub"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/github.svg" alt="GitHub" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:193px;top:21px;width:28px;height:28px;" data-name="Google Workspace"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/google.svg" alt="Google Workspace" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:147px;top:159px;width:28px;height:28px;" data-name="Okta"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/okta.svg" alt="Okta" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:101px;top:21px;width:28px;height:28px;" data-name="AWS"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/amazonwebservices.svg" alt="AWS" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:60px;top:58px;width:24px;height:24px;" data-name="ServiceNow"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/servicenow.svg" alt="ServiceNow" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:9px;top:159px;width:28px;height:28px;" data-name="Zendesk"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/zendesk.svg" alt="Zendesk" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:55px;top:159px;width:28px;height:28px;" data-name="PagerDuty"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/pagerduty.svg" alt="PagerDuty" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:101px;top:159px;width:28px;height:28px;" data-name="Zoom"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/zoom.svg" alt="Zoom" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:147px;top:90px;width:28px;height:28px;" data-name="Splunk"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/splunk.svg" alt="Splunk" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:325px;top:56px;width:22px;height:22px;" data-name="CrowdStrike"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/crowdstrike.svg" alt="CrowdStrike" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:240px;top:48px;width:36px;height:36px;" data-name="Workday"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/workday.svg" alt="Workday" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:193px;top:159px;width:28px;height:28px;" data-name="Intune"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/windows.svg" alt="Intune" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:395px;top:62px;width:16px;height:16px;" data-name="Jamf"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/jamf.svg" alt="Jamf" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:9px;top:90px;width:28px;height:28px;" data-name="Box"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/box.svg" alt="Box" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:101px;top:90px;width:28px;height:28px;" data-name="SAP"><span class="chip__mark"><img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/sap.svg" alt="SAP" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
    </div>

    <!-- +more label, sits between cluster and axiom card -->
    <div class="chip--more chip--more-center">+ more</div>


    <!-- CONNECTORS -->
    <svg class="connectors" id="connectors" viewBox="0 0 700 700" preserveAspectRatio="none">
      <defs>
        <linearGradient id="topBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(220,90,28,0.0)"/>
          <stop offset="55%" stop-color="rgba(220,90,28,0.25)"/>
          <stop offset="100%" stop-color="rgba(220,90,28,0.55)"/>
        </linearGradient>
        <linearGradient id="botBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(220,90,28,0.55)"/>
          <stop offset="45%" stop-color="rgba(220,90,28,0.25)"/>
          <stop offset="100%" stop-color="rgba(220,90,28,0.0)"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- AXIOM CARD -->
    <div class="axiom-hub">
      <div class="axiom-card">
        <div class="axiom-kicker"><span class="dot"></span>Live Graph</div>
        <div class="axiom-brand">Axiom</div>
        <div class="axiom-sub">Streaming · Enriched · Joined</div>
      </div>
    </div>
    <!-- OUTCOMES (horizontal row at bottom) -->
    <div class="outcomes">
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5h7L11 22l8.5-11.5h-7L13 2z"/></svg>
        </div>
        <div>
          <h3>Automation</h3>
          <p>Resolve at machine speed</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.4"/><circle cx="15" cy="14" r="1.4"/><path d="M12 4v4M9 4h6"/></svg>
        </div>
        <div>
          <h3>AI Agents</h3>
          <p>Reason over live context</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
        </div>
        <div>
          <h3>Workflows</h3>
          <p>Orchestrate across stack</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4V8z"/><path d="M10 6v12" stroke-dasharray="2 2"/></svg>
        </div>
        <div>
          <h3>Tickets</h3>
          <p>Auto-deflect &amp; enrich</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      function applyTheme(t) { document.body.classList.toggle('light', t === 'light'); }
      try {
        if (window.parent && window.parent.document && window.parent.document.body.classList.contains('light')) {
          applyTheme('light');
        }
      } catch (e) {}
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'theme') applyTheme(e.data.theme);
      });
    })();
    window.addEventListener('load', function () {
      const svg = document.getElementById('connectors');
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const stage = document.getElementById('stage');
      const stageRect = stage.getBoundingClientRect();
      const stageLeft = stageRect.left;
      const stageTop  = stageRect.top;
      const scale = 1;
      const toStage = (cx, cy) => ({
        x: (cx - stageLeft) / scale,
        y: (cy - stageTop)  / scale
      });

      const axiomEl = document.querySelector('.axiom-hub');
      const aRect = axiomEl.getBoundingClientRect();
      const aLeftMid = toStage(aRect.left, aRect.top + aRect.height / 2);
      const aRightMid = toStage(aRect.right, aRect.top + aRect.height / 2);
      const axiomLeft = { x: aLeftMid.x, y: aLeftMid.y };
      const axiomRight = { x: aRightMid.x, y: aRightMid.y };

      const chips = Array.from(document.querySelectorAll('.sources .chip'));

      // Each logo → axiom left edge (horizontal flow)
      chips.forEach((chip) => {
        if (chip.style.display === 'none') return;
        const r = chip.getBoundingClientRect();
        const c = toStage(r.right, r.top + r.height / 2);
        const sx = c.x, sy = c.y;
        const ex = axiomLeft.x, ey = axiomLeft.y;
        const dx = ex - sx;
        const d = `M ${sx},${sy} C ${sx + dx * 0.45},${sy} ${ex - dx * 0.55},${ey} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgba(220,90,28,0.55)');
        path.setAttribute('stroke-width', '0.7');
        path.setAttribute('opacity', '0.7');
        svg.appendChild(path);
      });
      // Axiom right edge → each outcome left edge
      document.querySelectorAll('.outcomes .outcome').forEach((el) => {
        const r = el.getBoundingClientRect();
        const c = toStage(r.left, r.top + r.height / 2);
        const sx = axiomRight.x, sy = axiomRight.y;
        const ex = c.x, ey = c.y;
        const dx = ex - sx;
        const d = `M ${sx},${sy} C ${sx + dx * 0.45},${sy} ${ex - dx * 0.55},${ey} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgba(220,90,28,0.55)');
        path.setAttribute('stroke-width', '0.7');
        path.setAttribute('opacity', '0.7');
        svg.appendChild(path);
      });
    });
  </script>
</body>
</html>
