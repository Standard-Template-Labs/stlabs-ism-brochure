<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<title>Axiom · The Live Graph powering stlabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1A1A1F;
    --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10);
    --text: rgba(254,254,254,0.92);
    --text-2: rgba(254,254,254,0.62);
    --text-3: rgba(254,254,254,0.40);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 491px;
    height: 491px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .stage {
    width: 700px;
    height: 700px;
    transform: scale(0.7014);
    transform-origin: top left;
    position: absolute;
    top: 0; left: 0;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }

  /* ── CLUSTER (top) ── */
  .sources {
    position: absolute;
    left: 30px;
    top: 30px;
    width: 640px;
    height: 200px;
    z-index: 3;
  }
  .chip {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .chip__mark { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .chip__mark img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    opacity: 0.92;
    transform: none;
    rotate: 0deg;
  }

  /* ── CONNECTORS ── */
  .connectors {
    position: absolute;
    inset: 0;
    width: 700px;
    height: 700px;
    z-index: 2;
    pointer-events: none;
  }

  /* ── AXIOM CARD (center) ── */
  .axiom-hub {
    position: absolute;
    left: 250px;
    top: 190px;
    width: 200px;
    z-index: 4;
  }
  .axiom-card {
    position: relative;
    width: 100%;
    padding: 10px 16px 12px;
    background: linear-gradient(160deg, rgba(220,90,28,0.12), rgba(220,90,28,0.04));
    border: 1px solid rgba(220,90,28,0.18);
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }
  .axiom-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #FFB48A;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .axiom-kicker .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #FF7A3D;
  }
  .axiom-brand {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #FEFEFE;
  }
  .axiom-sub {
    margin-top: 4px;
    font-size: 10px;
    color: rgba(255,180,140,0.9);
    font-weight: 400;
    white-space: nowrap;
  }

  /* ── OUTCOMES (horizontal row at bottom) ── */
  .outcomes {
    position: absolute;
    left: 30px;
    right: 30px;
    bottom: 280px;
    display: flex;
    gap: 12px;
    z-index: 4;
  }
  .outcome {
    flex: 1;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .outcome::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.65;
  }
  .outcome .ico {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid rgba(220,90,28,0.30);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .outcome .ico svg { width: 16px; height: 16px; }
  .outcome h3 {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
    line-height: 1.15;
  }
  .outcome p {
    margin: 0;
    font-size: 10px;
    color: var(--text-3);
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">

      <div class="chip" style="left:335px;top:26px;width:16px;height:16px;" data-name="Okta"><span class="chip__mark"><img src="https://cdn.simpleicons.org/okta/F4F5F6" alt="Okta" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:415px;top:0px;width:46px;height:46px;" data-name="AWS"><span class="chip__mark"><img src="https://cdn.simpleicons.org/amazonwebservices/F4F5F6" alt="AWS" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:505px;top:20px;width:40px;height:40px;" data-name="Salesforce"><span class="chip__mark"><img src="https://cdn.simpleicons.org/salesforce/F4F5F6" alt="Salesforce" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:170px;top:50px;width:26px;height:26px;" data-name="Datadog"><span class="chip__mark"><img src="https://cdn.simpleicons.org/datadog/F4F5F6" alt="Datadog" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:155px;top:85px;width:24px;height:24px;" data-name="ServiceNow"><span class="chip__mark"><img src="https://cdn.simpleicons.org/servicenow/F4F5F6" alt="ServiceNow" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:245px;top:68px;width:24px;height:24px;" data-name="Zendesk"><span class="chip__mark"><img src="https://cdn.simpleicons.org/zendesk/F4F5F6" alt="Zendesk" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:358px;top:85px;width:14px;height:14px;" data-name="PagerDuty"><span class="chip__mark"><img src="https://cdn.simpleicons.org/pagerduty/F4F5F6" alt="PagerDuty" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:410px;top:75px;width:38px;height:38px;" data-name="Zoom"><span class="chip__mark"><img src="https://cdn.simpleicons.org/zoom/F4F5F6" alt="Zoom" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:400px;top:0px;width:48px;height:48px;" data-name="Splunk"><span class="chip__mark"><img src="https://cdn.simpleicons.org/splunk/F4F5F6" alt="Splunk" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>

      <div class="chip" style="left:30px;top:143px;width:22px;height:22px;" data-name="CrowdStrike"><span class="chip__mark"><img src="https://cdn.simpleicons.org/crowdstrike/F4F5F6" alt="CrowdStrike" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:115px;top:150px;width:36px;height:36px;" data-name="Workday"><span class="chip__mark"><img src="https://cdn.simpleicons.org/workday/F4F5F6" alt="Workday" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:205px;top:140px;width:18px;height:18px;" data-name="Intune"><span class="chip__mark"><img src="https://cdn.simpleicons.org/windows/F4F5F6" alt="Intune" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:285px;top:156px;width:16px;height:16px;" data-name="Jamf"><span class="chip__mark"><img src="https://cdn.simpleicons.org/jamf/F4F5F6" alt="Jamf" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:290px;top:50px;width:34px;height:34px;" data-name="Box"><span class="chip__mark"><img src="https://cdn.simpleicons.org/box/F4F5F6" alt="Box" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
      <div class="chip" style="left:370px;top:50px;width:28px;height:28px;" data-name="SAP"><span class="chip__mark"><img src="https://cdn.simpleicons.org/sap/F4F5F6" alt="SAP" onerror="this.closest('.chip').style.display='none'" onload="if(!this.naturalWidth){this.closest('.chip').style.display='none';}"></span></div>
    </div>

    <!-- CONNECTORS -->
    <svg class="connectors" id="connectors" viewBox="0 0 700 700" preserveAspectRatio="none">
      <defs>
        <linearGradient id="downGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(220,90,28,0.0)"/>
          <stop offset="60%" stop-color="rgba(220,90,28,0.35)"/>
          <stop offset="100%" stop-color="rgba(220,90,28,0.8)"/>
        </linearGradient>
        <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="rgba(220,90,28,0.8)"/>
          <stop offset="100%" stop-color="rgba(244,245,246,0.18)"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- AXIOM CARD -->
    <div class="axiom-hub">
      <div class="axiom-card">
        <div class="axiom-kicker"><span class="dot"></span>Live Graph</div>
        <div class="axiom-brand">Axiom</div>
        <div class="axiom-sub">Streaming · Enriched · Joined</div>
      </div>
    </div>
    <!-- OUTCOMES (horizontal row at bottom) -->
    <div class="outcomes">
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5h7L11 22l8.5-11.5h-7L13 2z"/></svg>
        </div>
        <div>
          <h3>Automation</h3>
          <p>Resolve at machine speed</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.4"/><circle cx="15" cy="14" r="1.4"/><path d="M12 4v4M9 4h6"/></svg>
        </div>
        <div>
          <h3>AI Agents</h3>
          <p>Reason over live context</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
        </div>
        <div>
          <h3>Workflows</h3>
          <p>Orchestrate across stack</p>
        </div>
      </div>
      <div class="outcome">
        <div class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4V8z"/><path d="M10 6v12" stroke-dasharray="2 2"/></svg>
        </div>
        <div>
          <h3>Tickets</h3>

        </div>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener('load', function () {
      const svg = document.getElementById('connectors');
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const stage = document.getElementById('stage');
      const stageRect = stage.getBoundingClientRect();
      const stageLeft = stageRect.left;
      const stageTop  = stageRect.top;
      const scale = 0.7014;
      const toStage = (cx, cy) => ({
        x: (cx - stageLeft) / scale,
        y: (cy - stageTop)  / scale
      });

      const axiomTop    = { x: 350, y: 190 };


      const axiomBot    = { x: 350, y: 280 };

      const chips = Array.from(document.querySelectorAll('.sources .chip'));

      // Each logo → axiom top
      chips.forEach((chip) => {
        if (chip.style.display === 'none') return;
        const r = chip.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top + r.height);
        const sx = c.x, sy = c.y;
        const ex = axiomTop.x, ey = axiomTop.y;
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#downGrad)');
        path.setAttribute('stroke-width', '0.6');
        path.setAttribute('opacity', '0.45');
        svg.appendChild(path);
      });
      // Axiom bottom → top of each outcome
      document.querySelectorAll('.outcomes .outcome').forEach((el) => {
        const r = el.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top);
        const sx = axiomBot.x, sy = axiomBot.y;
        const ex = c.x, ey = c.y;
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#outGrad)');
        path.setAttribute('stroke-width', '0.7');
        path.setAttribute('opacity', '0.5');
        svg.appendChild(path);
      });
    });
  </script>
</body>
</html>
