<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<title>Axiom · The Live Graph powering stlabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1A1A1F;
    --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10);
    --text: rgba(254,254,254,0.92);
    --text-2: rgba(254,254,254,0.62);
    --text-3: rgba(254,254,254,0.40);
    --accent: #DC5A1C;
    --accent-soft: rgba(220,90,28,0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 491px;
    height: 491px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .stage {
    width: 700px;
    height: 700px;
    transform: scale(0.7014);
    transform-origin: top left;
    position: absolute;
    top: 0; left: 0;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }

  /* ── CLUSTER (top) ── */
  .sources {
    position: absolute;
    left: 30px;
    top: 30px;
    width: 640px;
    height: 200px;
    z-index: 3;
  }
  .chip {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .chip__mark { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .chip__mark img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    opacity: 0.92;
    transform: none;
    rotate: 0deg;
  }

  /* ── CONNECTORS ── */
  .connectors {
    position: absolute;
    inset: 0;
    width: 700px;
    height: 700px;
    z-index: 2;
    pointer-events: none;
  }

  /* ── AXIOM CARD (center) ── */
  .axiom-hub {
    position: absolute;
    left: 250px;
    top: 150px;
    width: 200px;
    z-index: 4;
  }
  .axiom-card {
    position: relative;
    width: 100%;
    padding: 10px 16px 12px;
    background: linear-gradient(160deg, rgba(220,90,28,0.12), rgba(220,90,28,0.04));
    border: 1px solid rgba(220,90,28,0.18);
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }
  .axiom-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #FFB48A;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .axiom-kicker .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #FF7A3D;
  }
  .axiom-brand {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #FEFEFE;
  }
  .axiom-sub {
    margin-top: 4px;
    font-size: 10px;
    color: rgba(255,180,140,0.9);
    font-weight: 400;
    white-space: nowrap;
  }

  /* ── STLABS LOGO (below axiom) ── */
  .stlabs-mark {
    position: absolute;
    left: 480px;
    top: 172px;
    width: 130px;
    z-index: 4;
    display: flex;
    justify-content: center;
  }
  .stlabs-mark svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── OUTCOMES (horizontal row at bottom) ── */
  .outcomes {
    position: absolute;
    left: 30px;
    right: 30px;
    bottom: 30px;
    display: flex;
    gap: 12px;
    z-index: 4;
  }
  .outcome {
    flex: 1;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .outcome::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.65;
  }
  .outcome .ico {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid rgba(220,90,28,0.30);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .outcome .ico svg { width: 16px; height: 16px; }
  .outcome h3 {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
    line-height: 1.15;
  }
  .outcome p {
    margin: 0;
    font-size: 10px;
    color: var(--text-3);
    line-height: 1.3;
  }
</style>
</head>

  <script>
    (function () {
      const svg = document.getElementById('connectors');
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const stage = document.getElementById('stage');
      const stageRect = stage.getBoundingClientRect();
      const stageLeft = stageRect.left;
      const stageTop  = stageRect.top;
      const scale = 0.7014;
      const toStage = (cx, cy) => ({
        x: (cx - stageLeft) / scale,
        y: (cy - stageTop)  / scale
      });

      const axiomTop    = { x: 350, y: 150 };
      const axiomRight  = { x: 450, y: 185 };
      const stlabsLeft  = { x: 480, y: 185 };
      // trunk anchors above
      const stlabsBot   = { x: 545, y: 205 };

      const chips = Array.from(document.querySelectorAll('.sources .chip'));

      // Each logo → axiom top
      chips.forEach((chip) => {
        const r = chip.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top + r.height);
        const sx = c.x, sy = c.y;
        const ex = axiomTop.x, ey = axiomTop.y;
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#downGrad)');
        path.setAttribute('stroke-width', '0.6');
        path.setAttribute('opacity', '0.45');
        svg.appendChild(path);
      });

      // Axiom bottom → stlabs top
      const trunk = document.createElementNS(SVG_NS, 'path');
      trunk.setAttribute('d', `M ${axiomRight.x},${axiomRight.y} L ${stlabsLeft.x},${stlabsLeft.y}`);
      trunk.setAttribute('fill', 'none');
      trunk.setAttribute('stroke', 'rgba(220,90,28,0.85)');
      trunk.setAttribute('stroke-width', '1.6');
      svg.appendChild(trunk);

      // Stlabs bottom → top of each outcome
      document.querySelectorAll('.outcomes .outcome').forEach((el) => {
        const r = el.getBoundingClientRect();
        const c = toStage(r.left + r.width / 2, r.top);
        const sx = stlabsBot.x, sy = stlabsBot.y;
        const ex = c.x, ey = c.y;
        const dy = ey - sy;
        const d = `M ${sx},${sy} C ${sx},${sy + dy * 0.45} ${ex},${ey - dy * 0.55} ${ex},${ey}`;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'url(#outGrad)');
        path.setAttribute('stroke-width', '0.7');
        path.setAttribute('opacity', '0.5');
        svg.appendChild(path);
      });
    })();
  </script>
